<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de produtos</title>
</head>
<body>
    <h1>configuração de hardware</h1>
    <hr>

    <!-- Configuração de hardware -->
        <fieldset>
            <p>
        <legend>Escolha placa de vídeo pricipal</legend>
        <select name="gpu" id="gpu" required>
            <option value="rtx4050">NVIDIA GeForce RTX 4050 6GB</option>
            <option value="gtx1650">NVIDIA GeForce GTX 1650 4GB</option>
            <option value="rtx3060">NVIDIA GeForce RTX 3060 6GB</option>
        </select>
            </p>

        <p>
            <strong>Objetivo de qualquer coisa</strong>
            <input type="radio" name="objetivo" id="jogos" value="jogos" checked>
            <label for="jogos">Jogos Eletrônicos</label><br>

            <input type="radio" name="objetivo" id="streaming" value="streaming">
            <label for="streaming">Live criação</label><br>

            <input type="radio" name="objetivo" id="edicao" value="edicao">
            <label for="edicao">Edição de vídeos</label><br>


        </p>


</body>
</html>
