<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Tabela do cliente</title>
</head>

<body>

    <h1>Fildset 1</h1>
    <hr>

    <!-- Grupo 01 dados do cliente em fildset -->
    <Fildset>
        <legend><strong>1. Dados do cliente </strong></legend>
        <p>
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome aqui." <required>
        </p>

        <p>
            <label for="e-mail">E-Mail</label>
            <input type="text" id="e-mail" name="e-mail" placeholder="Digite seu e-mail aqui." <required>
        </p>

        <p>
            <label for="Whatsapp">Whatsapp</label>
            <input type="tel" id="Whatsapp" name="Whatsapp" placeholder="(19) 99999-1234" <required>
        </p>








    </Fildset>









</body>

</html>
