<!DOCTYPE html>

<body>
    <header>

    <main>

        <section>

</body>

</html>
<!-- 
COMENTÁRIO REFLEXIVO

- Estrutura Lógica: O uso das tags <header>, <main>, <section> e <footer> 
  organiza a página em blocos claros e com significado, sem usar tags genéricas.

- Clareza: Títulos bem definidos (<h1> para o nome e <h2> para os tópicos) 
  e listas (<ul> e <li>) facilitam a leitura do código.

- Acessibilidade: As tags semânticas e o atributo lang="pt-br" ajudam os 
  leitores de tela a navegar e pronunciar o conteúdo corretamente para pessoas 
  com deficiência visual.
-->
