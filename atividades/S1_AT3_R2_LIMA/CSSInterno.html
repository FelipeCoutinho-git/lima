<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exemplo de uso de CSS interno">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Exemplo de CSS Interno</title>

    <style>
        body {
            background-color: lightblue;
            font-size: 48px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        h1 {
            color: rgb(5, 31, 132);
            text-align: center;
        }

        p {
            color: rgb(5, 31, 132);
            font-size: 30px;
            text-align: center;
        }
    </style>
</head>


<body>
    <h1>CSS Interno</h1>
    <div>
        <p>Este é um exemplo de parágrafo com estilo CSS interno.</p>

</body>

</html>
